name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係をinstall
        run: npm ci
      - name: Lintを実行
        run: npm run lint
      - name: Formatを検証
        run: npm run format:check
      - name: Testを実行
        run: npm test -- --run
      - name: Buildを実行
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係をinstall
        run: npm ci
      - name: Chromiumをinstall
        run: npx playwright install --with-deps chromium
      - name: DNS Slime E2E Testを実行
        run: npm run test:e2e
      - name: 失敗時のPlaywright reportを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
