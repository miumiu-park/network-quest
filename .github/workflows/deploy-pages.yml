name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5
      - name: 依存関係をinstall
        run: npm ci
      - name: GitHub Pages用にbuild
        run: npm run build
        env:
          VITE_BASE_PATH: /network-quest/
      - name: SPA fallbackを作成
        run: cp dist/index.html dist/404.html
      - name: Pages artifactをupload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへdeploy
        id: deployment
        uses: actions/deploy-pages@v4
