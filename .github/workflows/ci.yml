name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate initial repository structure
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: test -f README.md && test -f AGENTS.md && test -f docs/architecture.md
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint
      - name: Test
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm test -- --run
      - name: Build
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run build
